# Builds the standalone engine for Windows / macOS / Linux and attaches the
# binaries to the GitHub Release when a `v*` tag is pushed.
#
# Nexis pins each asset by tag + SHA-256 (`engine_asset` in
# src-tauri/src/modules/ml.rs), so the asset names below MUST match it:
#   windows x64 → axon-windows-x64.exe
#   linux x64   → axon-linux-x64
# Each job also uploads `<asset>.sha256` so a new pin can be checked against
# CI's own hash instead of a local download.
# (macOS builds are deferred — see the matrix note below.)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Create the release once (idempotent) so the matrix uploads don't race to
  # create it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" --generate-notes --verify-tag \
            || echo "release already exists"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: axon.exe
            asset: axon-windows-x64.exe
          - os: ubuntu-latest
            bin: axon
            asset: axon-linux-x64
          # macOS builds deferred — the macos-13 (Intel) runner queued for
          # hours and left releases hanging. Revisit later (likely a single
          # arm64 runner cross-compiling x64).
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked
      - name: Stage asset
        shell: bash
        run: |
          cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber
