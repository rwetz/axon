[package]
name = "axon"
version = "0.9.0"
edition = "2021"
description = "Axon — a single-binary ML engine (tabular MLPs and small CNNs, CPU or wgpu GPU) for the Nexis terminal's Synapse lab."
license = "Apache-2.0"
authors = ["Ryan Wetzstein"]
repository = "https://github.com/rwetz/axon"

# Nexis only spawns a binary whose file stem is exactly `axon` (or the
# legacy `nexis-ml`) and whose `--version` starts with that name.
[[bin]]
name = "axon"
path = "src/main.rs"

[dependencies]
# `cubecl` exposes burn::cubecl (the Runtime trait) so we can query the wgpu
# compute client's memory usage for the mem/gpu_mb metric.
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray", "autodiff", "wgpu", "cubecl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Decode folder-per-class images for the CNN path; png also encodes the
# sample-grid artifact. Lean feature set — no extra codecs pulled in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

[profile.release]
opt-level = 3
lto = true
strip = true
# Whole-program optimization for the shipped single binary (one-time compile
# cost). Note: `panic = "abort"` is intentionally NOT set — `gpu_available()`
# uses `catch_unwind` to probe for a wgpu adapter and fall back to CPU, which
# requires unwinding.
codegen-units = 1
